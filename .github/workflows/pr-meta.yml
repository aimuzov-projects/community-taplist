name: PR meta

# Назначает PR и ставит метки по заголовку, логика живёт в aimuzov-projects/.github.
# pull_request_target нужен для того чтобы PR от Renovate получали токен на запись,
# при этом из самого PR ничего не чекаутится и не запускается.
on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: write

jobs:
  meta:
    uses: aimuzov-projects/.github/.github/workflows/pr-meta.yml@main
