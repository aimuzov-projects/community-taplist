name: Check

# На main проверки зовёт деплой перед выкладкой, отдельный прогон там был бы вторым.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      # Приложение собирается на сервере, но упасть сборке лучше здесь.
      - run: npm run build
